name: Lint

on:
  push: {}
  pull_request: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Run Prettier check
        run: npm run format:check
      - name: Run ESLint
        run: npm run lint
      - name: Run typecheck
        run: npm run typecheck
