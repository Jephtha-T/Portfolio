name: Live Selenium Tests

on:
  push: {}
  workflow_dispatch: {}

jobs:
  selenium:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Chrome
        run: google-chrome --version

      - name: Run Selenium tests
        run: npm run test:e2e
